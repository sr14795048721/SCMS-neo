server:
  port: 8080

spring:
  application:
    name: gateway-service
  main:
    lazy-initialization: true
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          "[/**]":
            allowedOrigins:
              - http://localhost:3000
              - http://127.0.0.1:3000
              - https://kgwl.fun
              - https://www.kgwl.fun
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: file-api
          uri: ${FILE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/files/**
        - id: core-iot-api
          uri: ${CORE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/iot/v1/**
        - id: core-demo-observer
          uri: ${CORE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/demo-observer/**
        - id: core-api
          uri: ${CORE_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

scms:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-change-this-super-secret-key}
