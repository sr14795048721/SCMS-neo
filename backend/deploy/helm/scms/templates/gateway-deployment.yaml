apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: {{ .Values.gateway.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.gateway.port }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: docker
            - name: CORE_SERVICE_URL
              value: {{ .Values.gateway.coreServiceUrl | quote }}
            - name: FILE_SERVICE_URL
              value: "http://file-service:{{ .Values.file.port }}"
            - name: JWT_SECRET
              value: {{ .Values.jwtSecret | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: {{ .Values.gateway.port }}
      targetPort: {{ .Values.gateway.port }}
