global:
  scrape_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway-service:8080"]

  - job_name: core
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["core-service:8081"]

  - job_name: file
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["file-service:8082"]
