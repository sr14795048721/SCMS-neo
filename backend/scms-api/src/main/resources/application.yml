server:
  port: 8080

spring:
  application:
    name: scms-api
  main:
    lazy-initialization: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scms_dev}
    username: ${DB_USER:scms}
    password: ${DB_PASSWORD:scms}
    hikari:
      maximum-pool-size: 4
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 210MB
      max-request-size: 210MB

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

scms:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-change-this-super-secret-key}
    issuer: scms-plus
    access-expiration-minutes: ${SCMS_JWT_ACCESS_EXPIRATION_MINUTES:120}
    refresh-expiration-days: ${SCMS_JWT_REFRESH_EXPIRATION_DAYS:30}
  events:
    mode: ${EVENTS_MODE:sync}
  bootstrap:
    default-users: ${SCMS_BOOTSTRAP_DEFAULT_USERS:true}
  admin-init:
    enabled: ${SCMS_ADMIN_INIT_ENABLED:false}
    username: ${SCMS_ADMIN_INIT_USERNAME:}
    email: ${SCMS_ADMIN_INIT_EMAIL:}
    password: ${SCMS_ADMIN_INIT_PASSWORD:}
  super-admin-init:
    enabled: ${SCMS_SUPER_ADMIN_INIT_ENABLED:false}
    username: ${SCMS_SUPER_ADMIN_INIT_USERNAME:}
    email: ${SCMS_SUPER_ADMIN_INIT_EMAIL:}
    password: ${SCMS_SUPER_ADMIN_INIT_PASSWORD:}
  storage:
    banner-root: ${SCMS_STORAGE_BANNER_ROOT:./data/banners}
    news-root: ${SCMS_STORAGE_NEWS_ROOT:./data/news}
    reward-image-root: ${SCMS_STORAGE_REWARD_IMAGE_ROOT:./data/core-reward-images}
    manager-avatar-root: ${SCMS_STORAGE_MANAGER_AVATAR_ROOT:./data/manager-avatars}
    student-avatar-root: ${SCMS_STORAGE_STUDENT_AVATAR_ROOT:./data/student-avatars}
  media:
    ffmpeg-path: ${SCMS_MEDIA_FFMPEG_PATH:ffmpeg}
    banner-image-max-width: ${SCMS_MEDIA_BANNER_IMAGE_MAX_WIDTH:1600}
    banner-image-max-height: ${SCMS_MEDIA_BANNER_IMAGE_MAX_HEIGHT:900}
    banner-jpeg-quality: ${SCMS_MEDIA_BANNER_JPEG_QUALITY:82}
    banner-webp-quality: ${SCMS_MEDIA_BANNER_WEBP_QUALITY:80}
    banner-optimization-version: ${SCMS_MEDIA_BANNER_OPTIMIZATION_VERSION:1}
  app-workspace:
    storage:
      endpoint: ${SCMS_APP_WORKSPACE_STORAGE_ENDPOINT:${FILE_MINIO_ENDPOINT:}}
      access-key: ${SCMS_APP_WORKSPACE_STORAGE_ACCESS_KEY:${FILE_MINIO_ACCESS_KEY:}}
      secret-key: ${SCMS_APP_WORKSPACE_STORAGE_SECRET_KEY:${FILE_MINIO_SECRET_KEY:}}
      bucket: ${SCMS_APP_WORKSPACE_STORAGE_BUCKET:${FILE_MINIO_BUCKET:}}
  ai:
    enabled: ${SCMS_AI_ENABLED:true}
    base-url: ${SCMS_AI_BASE_URL:https://api.siliconflow.cn}
    api-key: ${SCMS_AI_API_KEY:}
    model: ${SCMS_AI_MODEL:Pro/deepseek-ai/DeepSeek-V3.1-Terminus}
    system-prompt: ${SCMS_AI_SYSTEM_PROMPT:You are a helpful assistant}
    timeout-seconds: ${SCMS_AI_TIMEOUT_SECONDS:60}

demo:
  observer-token: ${SCMS_DEMO_OBSERVER_TOKEN:yinzhi-demo}

logging:
  pattern:
    level: "%5p [rid:%X{requestId:-}]"
