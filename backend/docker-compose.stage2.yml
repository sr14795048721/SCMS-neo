services:
  core-service:
    environment:
      EVENTS_MODE: kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FILE_SERVICE_URL: http://file-service:8082

  gateway-service:
    environment:
      FILE_SERVICE_URL: http://file-service:8082

  kafka:
    image: bitnami/kafka:3.8
    container_name: scms-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_NUM_PARTITIONS: 1
      KAFKA_HEAP_OPTS: -Xms256m -Xmx256m
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    mem_limit: 512m

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    container_name: scms-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    mem_limit: 384m
    volumes:
      - minio_data:/data

  file-service:
    build:
      context: .
      dockerfile: file-service/Dockerfile
    container_name: scms-file
    environment:
      SPRING_PROFILES_ACTIVE: docker
      FILE_MINIO_ENDPOINT: http://minio:9000
      FILE_MINIO_ACCESS_KEY: minioadmin
      FILE_MINIO_SECRET_KEY: minioadmin
      FILE_MINIO_BUCKET: scms-files
      JWT_SECRET: "change-this-super-secret-key-change-this-super-secret-key"
    ports:
      - "8082:8082"
    mem_limit: 384m
    depends_on:
      - minio

volumes:
  minio_data:
