server:
  port: 8082

spring:
  application:
    name: file-service
  main:
    lazy-initialization: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

scms:
  jwt:
    secret: ${JWT_SECRET:change-this-super-secret-key-change-this-super-secret-key}

file:
  minio:
    endpoint: ${FILE_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${FILE_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${FILE_MINIO_SECRET_KEY:minioadmin}
    bucket: ${FILE_MINIO_BUCKET:scms-files}
